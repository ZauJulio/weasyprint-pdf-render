services:
  pdf-render:
    image: ghcr.io/zaujulio/pdf-render:latest
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - LOG_LEVEL=INFO
      - MAX_HTML_SIZE_MB=10
      - OTEL_ENABLED=false
      - OTEL_SERVICE_NAME=pdf-render
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Uncomment to enable tracing with Jaeger
  # jaeger:
  #   image: jaegertracing/all-in-one:1.54
  #   ports:
  #     - "16686:16686"  # Jaeger UI
  #     - "4317:4317"    # OTLP gRPC
  #   environment:
  #     - COLLECTOR_OTLP_ENABLED=true
